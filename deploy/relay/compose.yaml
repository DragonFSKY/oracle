services:
  relay:
    image: ${ORACLE_RELAY_IMAGE:-oracle-relay:local}
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    container_name: oracle-relay
    restart: unless-stopped
    env_file:
      - ${ORACLE_RELAY_ENV_FILE:-/etc/oracle-relay/relay.env}
    ports:
      - "127.0.0.1:19476:19476"
    volumes:
      - /var/lib/oracle-relay:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:19476/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      options:
        max-size: 10m
        max-file: "3"
